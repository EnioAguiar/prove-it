name: runner image

on:
  push:
    branches: [main]
    paths:
      - "runner/**"
      - ".github/workflows/runner-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: runner
          push: true
          tags: |
            ghcr.io/enioaguiar/proveit-runner:latest
            ghcr.io/enioaguiar/proveit-runner:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Prove It sandbox runner: Python 3.12, pytest, Hypothesis, numpy, pandas
            org.opencontainers.image.licenses=MIT
